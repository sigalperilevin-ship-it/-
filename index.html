<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>עידן היופי — מערכת ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal-900:#04342c; --teal-700:#0f7a80; --teal-500:#14a3aa; --teal-200:#9fe1cb; --teal-100:#cdeeea; --teal-50:#eef8f7;
  --pink-600:#993556; --pink-300:#ed93b1; --pink-100:#fbeaf0;
  --ink:#23343a; --ink-soft:#5b6b6e; --ink-mute:#94a3a2;
  --cream:#fbfbf9; --white:#ffffff; --line:#e2ece9;
  --danger:#a32d2d; --danger-bg:#fcebeb;
  --warn:#854f0b; --warn-bg:#faeeda;
  --ok:#27500a; --ok-bg:#eaf3de;
  --radius:14px; --shadow:0 2px 10px rgba(15,122,128,0.08);
}
:root:not([data-theme="light"]) {}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8f0ef; --ink-soft:#b7c6c4; --ink-mute:#7f9391;
    --cream:#0e1716; --white:#152220; --line:#23342f;
    --teal-50:#132422; --teal-100:#183a35; --pink-100:#2a1620;
  }
}
:root[data-theme="dark"]{
  --ink:#e8f0ef; --ink-soft:#b7c6c4; --ink-mute:#7f9391;
  --cream:#0e1716; --white:#152220; --line:#23342f;
  --teal-50:#132422; --teal-100:#183a35; --pink-100:#2a1620;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Assistant",sans-serif; background:var(--cream); color:var(--ink);
  direction:rtl; text-align:right; min-height:100vh; font-size:15px; line-height:1.5;
}
h1,h2,h3{font-family:"Frank Ruhl Libre",serif; font-weight:700; margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
#app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; padding-bottom:78px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
  background:linear-gradient(120deg,var(--teal-700),var(--teal-500)); color:#fff; position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center;}
.brand-mark svg{width:20px; height:20px;}
.brand-text{font-family:"Frank Ruhl Libre",serif; font-size:18px; font-weight:700; line-height:1.1;}
.brand-sub{font-size:10.5px; color:rgba(255,255,255,0.85);}
.area-switch{display:flex; background:rgba(255,255,255,0.16); border-radius:20px; padding:3px; gap:2px;}
.area-switch button{background:transparent; border:none; color:#fff; font-size:12.5px; padding:6px 12px; border-radius:18px; font-weight:600;}
.area-switch button.active{background:#fff; color:var(--teal-700);}
.screen{padding:18px;}
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.muted{color:var(--ink-soft); font-size:13px;}
.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
.pill-ok{background:var(--ok-bg); color:var(--ok);}
.pill-warn{background:var(--warn-bg); color:var(--warn);}
.pill-danger{background:var(--danger-bg); color:var(--danger);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; padding:11px 18px; font-size:14.5px; font-weight:600; border:1px solid transparent; width:100%;}
.btn-primary{background:var(--teal-700); color:#fff;}
.btn-primary:active{background:var(--teal-900);}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border:1px solid transparent;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{width:auto; flex:1;}
label.field{display:block; margin-bottom:14px;}
.field-label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field textarea,.field select{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--white); color:var(--ink); font-size:14.5px;
}
.field .err{color:var(--danger); font-size:12.5px; margin-top:4px; display:none;}
.field.has-err input{border-color:var(--danger);}
.field.has-err .err{display:block;}
.option{
  display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:9px; background:var(--white);
}
.option input{accent-color:var(--teal-700);}
.option.selected{border-color:var(--teal-700); background:var(--teal-50);}
.progress-dots{display:flex; gap:6px; margin-bottom:16px;}
.progress-dots span{height:5px; flex:1; border-radius:4px; background:var(--line);}
.progress-dots span.on{background:var(--teal-500);}
.hero{
  background:linear-gradient(160deg,var(--teal-50),var(--pink-100)); border-radius:var(--radius); padding:22px 18px; margin-bottom:16px; border:1px solid var(--teal-100);
}
.hero h2{font-size:21px; color:var(--teal-900); margin-bottom:6px;}
.section-title{font-size:12.5px; font-weight:700; color:var(--teal-700); text-transform:none; margin:20px 0 8px; letter-spacing:0;}
.calendar-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calendar-head button{background:var(--teal-50); border:1px solid var(--teal-100); border-radius:8px; width:32px; height:32px; color:var(--teal-700); font-size:15px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{text-align:center; font-size:11px; color:var(--ink-mute); padding-bottom:4px;}
.cal-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px; font-size:13px; background:var(--white); border:1px solid var(--line); color:var(--ink);}
.cal-cell.disabled{color:var(--ink-mute); background:var(--cream); border-color:var(--cream);}
.cal-cell.today{border-color:var(--teal-500); font-weight:700;}
.cal-cell.selected{background:var(--teal-700); color:#fff; border-color:var(--teal-700); font-weight:700;}
.cal-cell.empty{visibility:hidden;}
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.slot{padding:10px 4px; text-align:center; border-radius:9px; border:1px solid var(--line); background:var(--white); font-size:13.5px; font-weight:600;}
.slot.selected{background:var(--teal-700); color:#fff; border-color:var(--teal-700);}
.slot.taken{color:var(--ink-mute); background:var(--cream); text-decoration:line-through; border-color:var(--cream);}
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; background:var(--white); border-top:1px solid var(--line);
  display:flex; z-index:30;
}
.bottom-nav button{flex:1; background:none; border:none; padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-mute); font-size:11px;}
.bottom-nav button.active{color:var(--teal-700); font-weight:700;}
.icon{width:20px; height:20px;}
.list-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.avatar{width:40px; height:40px; border-radius:50%; background:var(--teal-100); color:var(--teal-900); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
.list-row-main{flex:1; min-width:0;}
.list-row-title{font-weight:600; font-size:14.5px;}
.list-row-sub{font-size:12.5px; color:var(--ink-soft);}
.chip-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
.chip{white-space:nowrap; padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--white); font-size:13px; color:var(--ink-soft); font-weight:600;}
.chip.active{background:var(--teal-700); color:#fff; border-color:var(--teal-700);}
.search-box{display:flex; align-items:center; gap:8px; background:var(--white); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:12px;}
.search-box input{border:none; outline:none; flex:1; background:transparent; font-size:14px; color:var(--ink);}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
.stat-card{background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center;}
.stat-num{font-size:19px; font-weight:700; color:var(--teal-700); font-family:"Frank Ruhl Libre",serif;}
.stat-label{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.photo-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.photo-pair{border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.photo-pair .imgs{display:flex;}
.photo-pair .imgs > div{flex:1; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.photo-pair .cap{padding:5px 8px; font-size:11px; color:var(--ink-soft); background:var(--white);}
.back-link{display:inline-flex; align-items:center; gap:5px; color:var(--teal-700); font-weight:600; font-size:13.5px; margin-bottom:14px; background:none; border:none;}
.toast{
  position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px;
  border-radius:24px; font-size:13.5px; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s;
}
.toast.show{opacity:1;}
.bar-track{height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; background:var(--teal-500); border-radius:6px;}
.consent-box{background:var(--white); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13px; color:var(--ink-soft); max-height:180px; overflow-y:auto; margin-bottom:14px; line-height:1.7;}
.check-row{display:flex; align-items:flex-start; gap:10px; background:var(--white); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
.check-row input{margin-top:3px; accent-color:var(--teal-700);}
.empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft);}
.divider{height:1px; background:var(--line); margin:14px 0;}
.note-item{background:var(--teal-50); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px;}
.rem-row{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--white);}
.rem-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.rem-msg{background:var(--teal-50); border-radius:10px; padding:10px 12px; font-size:13px; white-space:pre-wrap; line-height:1.6; margin-bottom:10px; color:var(--ink);}
.rem-actions{display:flex; gap:8px; flex-wrap:wrap;}
.rem-actions .btn{width:auto; flex:1; padding:9px 10px; font-size:13px; text-decoration:none;}
.btn-wa{background:#1f9d55; color:#fff;}
.pill-mute{background:var(--line); color:var(--ink-soft);}
.switch{position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch span{position:absolute; inset:0; background:var(--line); border-radius:20px; transition:.2s;}
.switch span:before{content:''; position:absolute; width:18px; height:18px; top:3px; right:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + span{background:var(--teal-700);}
.switch input:checked + span:before{transform:translateX(-18px);}
.setting-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0;}
.hint{font-size:11.5px; color:var(--ink-mute); margin-top:4px;}
.note-date{font-size:11px; color:var(--ink-mute); margin-bottom:3px;}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--teal-200);border-radius:10px;overflow:hidden;flex-shrink:0;}
.qty button{background:var(--teal-50);border:none;width:34px;height:34px;font-size:18px;color:var(--teal-700);font-weight:700;}
.qty span{min-width:30px;text-align:center;font-weight:700;}
.prod{padding:14px;}
.prod-head{display:flex;gap:12px;align-items:flex-start;cursor:pointer;}
.prod-thumb{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--teal-700);background:var(--teal-50);}
.prod-pigment{background:var(--pink-100);color:var(--pink-600);}
.prod-sebum{background:var(--ok-bg);color:var(--ok);}
.prod-age{background:var(--warn-bg);color:var(--warn);}
.prod-spf{background:#fff4d6;color:#8a6200;}
.prod-name{font-weight:700;font-size:15px;line-height:1.3;}
.prod-en{font-size:11.5px;color:var(--ink-mute);direction:ltr;text-align:right;}
.prod-for{font-size:12px;color:var(--teal-700);margin-top:3px;font-weight:600;}
.prod-desc{font-size:13.5px;color:var(--ink-soft);margin:10px 0 6px;line-height:1.6;}
.prod-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
.prod-price{font-family:"Frank Ruhl Libre",serif;font-size:19px;font-weight:700;color:var(--teal-900);}
:root[data-theme="dark"] .prod-price{color:var(--teal-200);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prod-price{color:var(--teal-200);}}
.shop-add{width:auto;padding:8px 16px;font-size:13.5px;}
.link-btn{background:none;border:none;color:var(--teal-700);font-weight:600;font-size:13px;padding:0;margin-bottom:4px;}
.cart-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;background:var(--teal-700);color:#fff;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;z-index:40;cursor:pointer;box-shadow:0 6px 20px rgba(4,52,44,.25);font-weight:600;}
.cart-bar span:nth-child(2){flex:1;}
.cart-badge{background:#fff;color:var(--teal-700);border-radius:20px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;padding:0 6px;}
.shop-banner{display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(120deg,var(--pink-100),var(--teal-50));border-color:var(--teal-100);}
.price-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
.price-in{width:76px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font-size:14px;text-align:center;}
.bottom-nav button{font-size:10.5px;}
.pedi-banner{display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(120deg,var(--teal-50),#eef3fb);border-color:var(--teal-100);}
.prod-foot-ic{background:#e6eefa;color:#2c5aa0;}
.svc-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:12px;margin-inline-start:4px;}
.svc-face{background:var(--pink-100);color:var(--pink-600);}
.svc-pedi{background:#e6eefa;color:#2c5aa0;}
.price-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.price-duo div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--white);}
.price-duo b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:22px;color:var(--teal-700);}
.treat{display:flex;gap:12px;align-items:flex-start;}
.treat .prod-thumb{width:40px;height:40px;}
.opt-check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;background:var(--white);cursor:pointer;}
.opt-check.selected{border-color:var(--teal-700);background:var(--teal-50);}
.opt-check input{accent-color:var(--teal-700);pointer-events:none;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
var KEY='edenBeautyData_v1';
var STAFF_NAME='עידן';

function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
var HDOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var HDOW_S=['א','ב','ג','ד','ה','ו','ש'];
var HMONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function defaultData(){
  var today=new Date();
  function iso(offsetDays){ var d=new Date(); d.setDate(d.getDate()+offsetDays); return fmtDate(d); }
  return {
    currentClientId:null,
    clients:[
      {id:'c1', name:'מיכל לוי', phone:'0521234567', email:'michal@example.com', consent:true,
       health:'ללא רגישויות ידועות. לא בהיריון. לא נוטלת תרופות רלוונטיות.',
       sessionsTotal:12, sessionsUsed:7, paid:1400, owed:200,
       photos:[{label:'אזור סנטר', before:true, after:true}],
       history:[{date:iso(-40), note:'התחלת טיפול, שיער עבה באזור הסנטר'},{date:iso(-10), note:'שיפור ניכר, ירידה בכמות'}],
       joined: iso(-45)},
      {id:'c2', name:'נועה כהן', phone:'0537654321', email:'noa@example.com', consent:true,
       health:'רגישות עורית קלה בעבר.',
       sessionsTotal:10, sessionsUsed:9, paid:2000, owed:0,
       photos:[{label:'שפה עליונה', before:true, after:true}],
       history:[{date:iso(-90), note:'תחילת תהליך'},{date:iso(-5), note:'כמעט סיום סדרה, מרוצה מאוד'}],
       joined: iso(-95)},
      {id:'c3', name:'שירה אברהם', phone:'0541112233', email:'shira@example.com', consent:true,
       health:'ללא הערות מיוחדות.',
       sessionsTotal:12, sessionsUsed:2, paid:400, owed:400,
       photos:[],
       history:[{date:iso(-14), note:'מפגש ראשון בוצע'}],
       joined: iso(-14)}
    ],
    appointments:[
      {id:'a1', clientId:'c1', date:iso(0), time:'10:00', status:'confirmed', manual:false},
      {id:'a2', clientId:'c2', date:iso(0), time:'13:00', status:'confirmed', manual:false},
      {id:'a3', clientId:'c3', date:iso(1), time:'11:00', status:'confirmed', manual:false},
      {id:'a4', clientId:'c1', date:iso(7), time:'10:00', status:'confirmed', manual:false}
    ]
  };
}

var DEFAULT_TEMPLATE='היי {שם} 🌸\nתזכורת קטנה מעידן היופי – מחכה לך {מתי}, יום {יום} {תאריך} בשעה {שעה}.\n{מפגש}\nלאישור הגעה השיבי 1, ואם צריך לשנות – השיבי 2 ונמצא זמן אחר.\nנתראה! 💗';
function ensureDefaults(d){
  if(!d.reminderSettings) d.reminderSettings={auto:true, sendTime:'17:00', template:DEFAULT_TEMPLATE, prep:''};
  (d.appointments||[]).forEach(function(a){ if(!a.reminder) a.reminder={sentAt:null, response:null}; });
  ensureShop(d);
  return d;
}
function loadData(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw) return ensureDefaults(JSON.parse(raw));
  }catch(e){}
  var d=ensureDefaults(defaultData());
  saveData(d);
  return d;
}
function saveData(d){
  try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
}
var DB=loadData();

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

var STATE={area:'landing', view:'home', params:{}, intake:{step:0, answers:{}}, booking:{}, newClient:{}};

function pushState(area,view,params){
  STATE.area=area; STATE.view=view; STATE.params=params||{};
  history.pushState({area:area,view:view,params:params||{}}, '', '');
  render();
}
window.addEventListener('popstate', function(e){
  if(e.state){
    STATE.area=e.state.area; STATE.view=e.state.view; STATE.params=e.state.params||{};
  } else {
    STATE.area='landing'; STATE.view='home'; STATE.params={};
  }
  render();
});
history.replaceState({area:'landing',view:'home',params:{}}, '', '');

function icon(name){

function client(id){
  for(var i=0;i<DB.clients.length;i++) if(DB.clients[i].id===id) return DB.clients[i];
  return null;
}
function apptsFor(dateStr){
  return DB.appointments.filter(function(a){ return a.date===dateStr && a.status!=='cancelled'; });
}
function bookedTimesFor(dateStr){
  return apptsFor(dateStr).map(function(a){ return a.time; });
}
function slotsForDate(d){
  var dow=d.getDay();
  if(dow===6) return [];
  var start=9, end= dow===5 ? 13 : 17;
  var out=[];
  for(var h=start; h<=end; h++){ out.push(pad(h)+':00'); }
  return out;
}

function renderBooking(){
  var b=STATE.booking;
  if(!b.month) { var t=new Date(); b.month=t.getMonth(); b.year=t.getFullYear(); }
  var html='<div class="screen">';
  if(b.service==='pedicure'){
    html += '<button class="back-link" data-action="toPediIntake">'+icon('home')+' חזרה לשאלון</button>';
    html += '<h2 style="margin-bottom:4px">בחירת מועד</h2><p class="muted" style="margin-bottom:12px">פדיקור רפואי · '+b.price+' ₪</p>';
  } else {
  html += '<button class="back-link" data-action="toConsent">'+icon('home')+' חזרה לאישור</button>';
  html += '<h2 style="margin-bottom:12px">בחרי תאריך</h2>';
  }

  var today=new Date(); today.setHours(0,0,0,0);
  var maxDate=new Date(); maxDate.setDate(maxDate.getDate()+365);
  var first=new Date(b.year,b.month,1);
  var startDow=first.getDay();
  var daysInMonth=new Date(b.year,b.month+1,0).getDate();

  html += '<div class="card">';
  html += '<div class="calendar-head"><button data-action="calPrev">›</button><b>'+HMONTHS[b.month]+' '+b.year+'</b><button data-action="calNext">‹</button></div>';
  html += '<div class="cal-grid">';
  HDOW_S.forEach(function(d){ html+='<div class="cal-dow">'+d+'</div>'; });
  for(var i=0;i<startDow;i++){ html+='<div class="cal-cell empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var dateObj=new Date(b.year,b.month,d);
    var ds=fmtDate(dateObj);
    var isPast = dateObj < today;
    var isTooFar = dateObj > maxDate;
    var slots = slotsForDate(dateObj);
    var disabled = isPast || isTooFar || slots.length===0;
    var cls='cal-cell';
    if(disabled) cls+=' disabled';
    if(ds===todayStr()) cls+=' today';
    if(b.date===ds) cls+=' selected';
    html += '<div class="'+cls+'" '+(disabled?'':'data-action="pickDate" data-date="'+ds+'"')+'>'+d+'</div>';
  }
  html += '</div></div>';

  if(b.date){
    var slots=slotsForDate(new Date(b.date+'T00:00:00'));
    var booked=bookedTimesFor(b.date);
    html += '<div class="section-title">שעות פנויות ל-'+b.date.split('-').reverse().join('.')+'</div>';
    html += '<div class="slots">';
    slots.forEach(function(s){

function computeAlerts(){
  var out=[];
  DB.clients.forEach(function(c){
    var remaining=c.sessionsTotal-c.sessionsUsed;
    if(c.sessionsTotal && remaining<=2 && remaining>0) out.push({type:'package', client:c, text:'נותרו '+remaining+' מפגשים בחבילה'});
    if(c.owed>0) out.push({type:'unpaid', client:c, text:'יתרת חוב פתוחה: '+c.owed+' ₪'});
  });
  var tmr=new Date(); tmr.setDate(tmr.getDate()+1);

  DB.appointments.filter(function(a){return a.date===tmrStr && a.status!=='cancelled';}).forEach(function(a){

  });
  return out;
}

// which appointment dates get a reminder today: tomorrow; on Friday also Sunday; nothing on Shabbat
function reminderTargetDates(){
  var now=new Date(), dow=now.getDay();
  if(dow===6) return [];
  var out=[fmtDate(addDays(now,1))];
  if(dow===5) out.push(fmtDate(addDays(now,2)));
  return out;
}
function reminderQueue(){
  var dates=reminderTargetDates();
  var items=DB.appointments.filter(function(a){ return dates.indexOf(a.date)>-1 && a.status!=='cancelled'; })
    .sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
  items.forEach(function(a){ if(!a.reminder) a.reminder={sentAt:null,response:null}; });
  var label = dates.length===2 ? 'שבת וראשון' : 'מחר';
  return {dates:dates, items:items, label:label};
}
function phoneValid(p){ return /^05\d{8}$/.test(p||''); }
function waLink(phone,text){ return 'https://wa.me/972'+phone.slice(1)+'?text='+encodeURIComponent(text); }
function nextApptFor(clientId){
  var t=todayStr();
  return DB.appointments.filter(function(a){ return a.clientId===clientId && a.status!=='cancelled' && a.date>=t; })
    .sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); })[0];
}
function buildReminder(a){
  var c=client(a.clientId); var st=DB.reminderSettings;
  var d=new Date(a.date+'T00:00:00');
  var diff=Math.round((d-new Date(todayStr()+'T00:00:00'))/86400000);
  var when = diff===0?'היום':(diff===1?'מחר':'ב');
  var sessionLine='';
  if(c && c.sessionsTotal){ var n=Math.min(c.sessionsUsed+1,c.sessionsTotal); sessionLine='זה המפגש ה-'+n+' מתוך '+c.sessionsTotal+' בסדרה שלך 💪'; }
  var msg=(st.template||DEFAULT_TEMPLATE)
    .replace(/\{שם\}/g, c? c.name.split(' ')[0] : '')
    .replace(/\{מתי\}/g, when)
    .replace(/\{יום\}/g, HDOW[d.getDay()])
    .replace(/\{תאריך\}/g, a.date.split('-').reverse().slice(0,2).join('.'))
    .replace(/\{שעה\}/g, a.time)
    .replace(/\{מפגש\}/g, sessionLine)
    .replace(/מחכה לך ב, /,'מחכה לך ');
  if(st.prep && st.prep.trim()) msg += '\n'+st.prep.trim();
  return msg.replace(/\n{2,}/g,'\n');
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderAdminReminders(){
  var st=DB.reminderSettings;
  var q=reminderQueue();
  var html='<div class="screen">';
  html += '<h2 style="margin-bottom:4px">תזכורות תורים</h2>';
  html += '<p class="muted" style="margin:0 0 14px">תזכורת בוואטסאפ יום לפני התור · לא נשלח בשבת, ובשישי יוצאות גם התזכורות של יום ראשון</p>';

  var sent=q.items.filter(function(a){return a.reminder.sentAt;}).length;
  var ok=q.items.filter(function(a){return a.reminder.response==='confirmed';}).length;
  var chg=q.items.filter(function(a){return a.reminder.response==='change';}).length;
  html += '<div class="stat-grid">'+
    '<div class="stat-card"><div class="stat-num">'+sent+'/'+q.items.length+'</div><div class="stat-label">נשלחו</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+ok+'</div><div class="stat-label">אישרו הגעה</div></div>'+
    '<div class="stat-card"><div class="stat-num" style="color:'+(chg?'var(--warn)':'var(--teal-700)')+'">'+chg+'</div><div class="stat-label">ביקשו שינוי</div></div>'+
  '</div>';

  html += '<div class="section-title" style="margin-top:0">תורים ל'+q.label+'</div>';
  if(!q.dates.length){
    html += '<div class="card"><div class="empty-state">שבת – לא שולחים תזכורות היום. התזכורות של ראשון יצאו ביום שישי.</div></div>';
  } else if(!q.items.length){
    html += '<div class="card"><div class="empty-state">אין תורים ל'+q.label+' – אין למי להזכיר 🌿</div></div>';
  }
  q.items.forEach(function(a){
    var c=client(a.clientId); if(!c) return;
    var msg=buildReminder(a);
    var r=a.reminder;
    var status = r.response==='confirmed' ? '<span class="pill pill-ok">אישרה הגעה</span>'
      : r.response==='change' ? '<span class="pill pill-warn">ביקשה שינוי</span>'
      : r.sentAt ? '<span class="pill pill-mute">נשלחה · '+r.sentAt+'</span>'
      : '<span class="pill pill-danger">ממתינה לשליחה</span>';
    var d=new Date(a.date+'T00:00:00');
    html += '<div class="rem-row">';
    html += '<div class="rem-head"><div class="avatar">'+c.name.split(' ').map(function(w){return w[0];}).join('')+'</div>'+
      '<div class="list-row-main"><div class="list-row-title">'+c.name+'</div><div class="list-row-sub">'+HDOW[d.getDay()]+' · '+a.time+' · '+c.phone+'</div></div>'+status+'</div>';
    if(!phoneValid(c.phone)){
      html += '<div class="pill pill-danger" style="display:block; margin-bottom:8px">מספר טלפון לא תקין – יש לעדכן בכרטיס הלקוחה</div>';
    } else {
      html += '<div class="rem-msg">'+esc(msg)+'</div>';
      html += '<div class="rem-actions">'+
        '<a class="btn btn-wa" href="'+waLink(c.phone,msg)+'" target="_blank" rel="noopener" data-action="markSent" data-id="'+a.id+'">'+(r.sentAt?'שליחה שוב':'שליחה בוואטסאפ')+'</a>';
      if(r.sentAt){
        html += '<button class="btn btn-ghost" data-action="remResp" data-id="'+a.id+'" data-r="confirmed">השיבה 1 · מגיעה</button>'+
          '<button class="btn btn-ghost" data-action="remResp" data-id="'+a.id+'" data-r="change">השיבה 2 · שינוי</button>';
      }
      html += '</div>';
      if(r.response==='change'){
        html += '<button class="btn btn-primary" style="margin-top:8px" data-action="openClient" data-id="'+c.id+'">פתיחת כרטיס לקוחה לתיאום מועד חדש</button>';
      }
    }
    html += '</div>';
  });

  html += '<div class="section-title">הגדרות תזכורת</div>';
  html += '<div class="card">';
  html += '<div class="setting-row"><div><div style="font-weight:600">תזכורת אוטומטית יום לפני</div><div class="hint">כשהמערכת תחובר ל-WhatsApp Business ההודעות ייצאו לבד בשעה שנקבעה</div></div>'+
    '<label class="switch"><input type="checkbox" id="rem-auto" '+(st.auto?'checked':'')+'><span></span></label></div>';
  html += '<div class="divider"></div>';
  html += '<label class="field"><span class="field-label">שעת שליחה</span><select id="rem-time">';
  ['10:00','12:00','14:00','16:00','17:00','18:00','19:00','20:00'].forEach(function(t){ html+='<option '+(st.sendTime===t?'selected':'')+'>'+t+'</option>'; });
  html += '</select></label>';
  html += '<label class="field"><span class="field-label">נוסח ההודעה</span><textarea id="rem-template" rows="6">'+esc(st.template)+'</textarea>'+
    '<div class="hint">אפשר להשתמש ב: {שם} {מתי} {יום} {תאריך} {שעה} {מפגש}</div></label>';
  html += '<label class="field"><span class="field-label">הנחיות הכנה לפני טיפול (רשות)</span><input type="text" id="rem-prep" value="'+esc(st.prep||'')+'" placeholder="שורה שתתווסף בסוף ההודעה"></label>';
  html += '<div class="btn-row"><button class="btn btn-primary" data-action="saveRemSettings">שמירת הגדרות</button><button class="btn btn-ghost" data-action="resetRemTemplate">נוסח ברירת מחדל</button></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function ensureShop(d){
  if(!d.products) d.products=defaultProducts();
  if(!d.orders) d.orders=[];
  if(!d.cart) d.cart={};
  if(d.pricesConfirmed===undefined) d.pricesConfirmed=false;
  return d;
}
function product(id){ for(var i=0;i<DB.products.length;i++) if(DB.products[i].id===id) return DB.products[i]; return null; }
function cartCount(){ var n=0; for(var k in DB.cart) n+=DB.cart[k]; return n; }
function cartTotal(){ var t=0; for(var k in DB.cart){ var p=product(k); if(p) t+=p.price*DB.cart[k]; } return t; }
function money(n){ return n.toLocaleString('he-IL')+' ₪'; }
var ORDER_STATUS={'new':'התקבלה','ready':'מוכנה לאיסוף/משלוח','done':'נמסרה','cancelled':'בוטלה'};

function handleShopAction(action, el){
  if(action==='shopCat'){ STATE.params.cat=el.getAttribute('data-cat'); STATE.params.open=null; render(); return true; }
  if(action==='prodToggle'){ var id=el.getAttribute('data-id'); STATE.params.open = STATE.params.open===id? null : id; render(); return true; }
  if(action==='cartAdd'){ var id=el.getAttribute('data-id'); DB.cart[id]=(DB.cart[id]||0)+1; saveData(DB); render(); if(cartCount()===1) showToast('נוסף לסל'); return true; }
  if(action==='cartSub'){ var id=el.getAttribute('data-id'); DB.cart[id]=(DB.cart[id]||0)-1; if(DB.cart[id]<=0) delete DB.cart[id]; saveData(DB); render(); return true; }
  if(action==='setDelivery'){ STATE.params.delivery=el.getAttribute('data-v'); render(); return true; }
  if(action==='placeOrder'){
    var name=document.getElementById('or-name').value.trim();
    var phone=document.getElementById('or-phone').value.trim();
    var addrEl=document.getElementById('or-addr');
    var addr=addrEl? addrEl.value.trim() : '';
    var errEl=document.getElementById('or-phone-err');
    if(!name){ showToast('נא להזין שם מלא'); return true; }
    if(!validPhone(phone)){ errEl.style.display='block'; return true; }
    if(addrEl && !addr){ showToast('נא להזין כתובת למשלוח'); return true; }
    var del=STATE.params.delivery||'pickup';
    var items=Object.keys(DB.cart).map(function(id){ var p=product(id); return {id:id,name:p.name,price:p.price,qty:DB.cart[id]}; });
    var fee=del==='ship'?DELIVERY_FEE:0;
    var o={id:uid(), num:1000+DB.orders.length+1, clientId:DB.currentClientId||null, name:name, phone:phone, delivery:del, address:addr,
      note:document.getElementById('or-note').value.trim(), items:items, fee:fee, total:cartTotal()+fee, date:todayStr(), status:'new'};
    DB.orders.push(o); DB.cart={}; saveData(DB);
    pushState('landing','order-done',{id:o.id});
    return true;
  }
  if(action==='shopTab'){ STATE.params.tab=el.getAttribute('data-tab'); render(); return true; }
  if(action==='orderStatus'){
    var id=el.getAttribute('data-id'), s=el.getAttribute('data-s');
    DB.orders.forEach(function(o){ if(o.id===id) o.status=s; });
    saveData(DB); render(); showToast('סטטוס עודכן: '+ORDER_STATUS[s]); return true;
  }
  if(action==='savePrices'){
    document.querySelectorAll('.price-in').forEach(function(inp){ var p=product(inp.getAttribute('data-id')); var v=parseInt(inp.value,10); if(p && v>=0) p.price=v; });
    document.querySelectorAll('.act-in').forEach(function(inp){ var p=product(inp.getAttribute('data-id')); if(p) p.active=inp.checked; });
    DB.pricesConfirmed=true; saveData(DB); render(); showToast('המחירון נשמר'); return true;
  }
  return false;
}

/* ---------- ROUTER / RENDER ---------- */

function render(){
  var app=document.getElementById('app');
  var body='';
  body += topbar();

  if(STATE.area==='landing'){
    if(STATE.view==='home') body += renderLandingHome();
    else if(STATE.view==='login') body += renderLogin();
    else if(STATE.view==='intake') body += (STATE.intake.step<INTAKE_Q().length ? renderIntake() : (STATE.intake.answers.urgency==='עדיין שוקלת, לא כרגע' ? renderIntakeFollowup() : renderConsent()));
    else if(STATE.view==='booking-only') body += renderBooking();
    else if(STATE.view==='booking') body += renderBooking();
    else if(STATE.view==='new-client-details') body += renderClientDetailsForm();
    else if(STATE.view==='booking-done') body += renderBookingDone();
    else if(STATE.view==='dashboard') body += renderClientDashboard();
    else if(STATE.view==='pedicure') body += renderPedicure();
    else if(STATE.view==='pedi-intake') body += renderPediIntake();
    else if(STATE.view==='shop') body += renderShop();
    else if(STATE.view==='cart') body += renderCart();
    else if(STATE.view==='order-done') body += renderOrderDone();
    else body += renderLandingHome();
  } else if(STATE.area==='admin'){
    if(STATE.view==='overview') body += renderAdminOverview();
    else if(STATE.view==='calendar') body += renderAdminCalendar();
    else if(STATE.view==='add-appt') body += renderAdminAddAppt();
    else if(STATE.view==='clients') body += renderAdminClients();
    else if(STATE.view==='client-detail') body += renderClientDetail();
    else if(STATE.view==='alerts') body += renderAdminAlerts();
    else if(STATE.view==='reminders') body += renderAdminReminders();
    else if(STATE.view==='shop') body += renderAdminShop();
    else body += renderAdminOverview();
    body += adminNav();
  }

  app.innerHTML = body;
}

/* ---------- EVENT HANDLING ---------- */

document.addEventListener('click', function(e){
  var navEl=e.target.closest('[data-nav]');
  if(navEl){
    var parts=navEl.getAttribute('data-nav').split(':');
    var area=parts[0], view=parts[1]||'home';
    if(area==='admin' && view===undefined) view='overview';
    if(area==='landing' && !view) view='home';
    if(area==='admin' && parts.length===1) view='overview';
    if(view==='intake'){ STATE.intake={step:0, answers:{}}; }
    if(view==='booking' || view==='booking-only'){ STATE.booking={}; }
    pushState(area, view, {});
    return;
  }
  var actionEl=e.target.closest('[data-action]');
  if(!actionEl) return;
  var action=actionEl.getAttribute('data-action');
  handleAction(action, actionEl, e);
});

document.addEventListener('change', function(e){
  if(e.target.id==='ap-existing'){
    var val=e.target.value;
    document.getElementById('ap-new-fields').style.display = val ? 'none' : 'block';
  }
});
document.addEventListener('keyup', function(e){
  if(e.target.id==='client-search'){
    STATE.params.q=e.target.value;
    render();
    var inp=document.getElementById('client-search');
    if(inp){ inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; }
  }
});

function validPhone(v){ return /^05\d{8}$/.test(v); }

function handleAction(action, el){
  if(handleShopAction(action, el)) return;
  if(action==='pediStart'){ STATE.pedi={gender:null, problems:[], health:[]}; pushState('landing','pedi-intake',{}); return; }
  if(action==='pediGender'){ STATE.pedi.gender=el.getAttribute('data-g'); render(); return; }
  if(action==='pediToggle'){
    var lst=el.getAttribute('data-list'); var src=lst==='problems'?PEDI_PROBLEMS:PEDI_HEALTH;
    var t=src[+el.getAttribute('data-i')]; var arr=STATE.pedi[lst]; var none=PEDI_HEALTH[PEDI_HEALTH.length-1];
    var ix=arr.indexOf(t);
    if(ix>-1) arr.splice(ix,1);
    else {
      if(lst==='health'){ if(t===none) arr.length=0; else { var nx=arr.indexOf(none); if(nx>-1) arr.splice(nx,1); } }
      arr.push(t);
    }
    var keepChk=document.getElementById('pedi-consent'); var wasChecked=keepChk&&keepChk.checked;
    render();
    var nc=document.getElementById('pedi-consent'); if(nc) nc.checked=wasChecked;
    return;
  }
  if(action==='pediContinue'){
    var P=STATE.pedi;
    if(!P.gender){ showToast('נא לבחור עבור מי הטיפול'); return; }
    if(!P.problems.length){ showToast('נא לבחור מה מפריע לך'); return; }
    if(!P.health.length){ showToast('נא לסמן מצב בריאותי'); return; }
    if(!document.getElementById('pedi-consent').checked){ showToast('נא לאשר את הפרטים כדי להמשיך'); return; }
    STATE.booking={service:'pedicure', price:PEDI_PRICE[P.gender], gender:P.gender, problems:P.problems.slice(),
      healthText:'פדיקור: '+P.health.join(', ')};
    pushState('landing','booking',{});
    return;
  }
  if(action==='toPediIntake'){ pushState('landing','pedi-intake',{}); return; }
  if(action==='logout'){ DB.currentClientId=null; saveData(DB); pushState('landing','home',{}); return; }
  if(action==='loginAs'){ DB.currentClientId=el.getAttribute('data-id'); saveData(DB); pushState('landing','dashboard',{}); return; }

  if(action==='intakeBack'){
    if(STATE.intake.step===0){ pushState('landing','home',{}); }
    else{ STATE.intake.step--; render(); }
    return;
  }
  if(action==='intakeSelect'){
    var key=el.getAttribute('data-key'), val=el.getAttribute('data-val');
    STATE.intake.answers[key]=val;
    setTimeout(function(){
      STATE.intake.step++;
      render();
    }, 150);
    return;
  }
  if(action==='intakeBackToLast'){
    STATE.intake.step=INTAKE_Q().length-1;
    render();
    return;
  }
  if(action==='submitFollowup'){
    var name=document.getElementById('fu-name').value.trim();
    var phone=document.getElementById('fu-phone').value.trim();
    var errEl=document.getElementById('fu-phone-err');
    if(!validPhone(phone)){ errEl.style.display='block'; return; }
    errEl.style.display='none';
    showToast('הפרטים נשמרו, ניצור קשר בקרוב');
    pushState('landing','home',{});
    return;
  }
  if(action==='confirmConsent'){
    var chk=document.getElementById('consent-check');
    if(!chk.checked){ showToast('נא לאשר את ההסכמה כדי להמשיך'); return; }
    STATE.booking={};
    pushState('landing','booking',{});
    return;
  }
  if(action==='toConsent'){
    pushState('landing','intake',{});
    STATE.intake.step=INTAKE_Q().length-1;
    render();
    return;
  }
  if(action==='calPrev' || action==='calNext'){
    var b=STATE.booking.month!==undefined? STATE.booking : (STATE.view==='add-appt'? STATE.booking : STATE.booking);
    var delta = action==='calNext' ? -1 : 1;
    var d=new Date(b.year, b.month+delta, 1);
    b.month=d.getMonth(); b.year=d.getFullYear();
    render();
    return;
  }
  if(action==='pickDate'){
    STATE.booking.date=el.getAttribute('data-date');
    STATE.booking.time=null;
    render();
    return;
  }
  if(action==='pickTime'){
    STATE.booking.time=el.getAttribute('data-time');
    render();
    return;
  }
  if(action==='confirmBooking'){
    if(DB.currentClientId){
      finalizeAppointment(DB.currentClientId);
      pushState('landing','booking-done',{});
    } else {
      pushState('landing','new-client-details',{});
    }
    return;
  }
  if(action==='finalizeBooking'){
    var name=document.getElementById('nc-name').value.trim();
    var phone=document.getElementById('nc-phone').value.trim();
    var email=document.getElementById('nc-email').value.trim();
    var errEl=document.getElementById('nc-phone-err');
    if(!name || !validPhone(phone)){
      if(!validPhone(phone)) errEl.style.display='block';
      if(!name) showToast('נא להזין שם מלא');
      return;
    }
    errEl.style.display='none';
    var isPediB=STATE.booking.service==='pedicure';
    var newC={id:uid(), name:name, phone:phone, email:email, consent:true, health:(isPediB? STATE.booking.healthText : 'טרם עודכן'), sessionsTotal:(isPediB?0:12), sessionsUsed:0, paid:0, owed:0, photos:[], history:[], joined:todayStr()};
    DB.clients.push(newC);
    DB.currentClientId=newC.id;
    finalizeAppointment(newC.id);
    saveData(DB);
    pushState('landing','booking-done',{});
    return;
  }
  if(action==='cancelAppt'){
    var id=el.getAttribute('data-id');
    DB.appointments.forEach(function(a){ if(a.id===id) a.status='cancelled'; });
    saveData(DB);
    showToast('התור בוטל');
    render();
    return;
  }
  if(action==='rescheduleStart'){
    var id=el.getAttribute('data-id');
    DB.appointments.forEach(function(a){ if(a.id===id) a.status='cancelled'; });
    saveData(DB);
    STATE.booking={};
    pushState('landing','booking-only',{});
    return;
  }

  if(action==='openClient'){
    pushState('admin','client-detail',{id:el.getAttribute('data-id')});
    return;
  }
  if(action==='sendReminder'){
    var c=client(el.getAttribute('data-id'));
    var a=c? nextApptFor(c.id) : null;
    if(!c || !phoneValid(c.phone)){ showToast('אין מספר טלפון תקין ללקוחה'); return; }
    if(!a){ showToast('אין ללקוחה תור עתידי'); return; }
    if(!a.reminder) a.reminder={sentAt:null,response:null};
    var now=new Date(); a.reminder.sentAt=pad(now.getHours())+':'+pad(now.getMinutes()); saveData(DB);
    window.open(waLink(c.phone, buildReminder(a)), '_blank', 'noopener');
    showToast('נפתח וואטסאפ עם התזכורת');
    return;
  }
  if(action==='markSent'){
    var id=el.getAttribute('data-id');
    DB.appointments.forEach(function(a){ if(a.id===id){ var n=new Date(); a.reminder.sentAt=pad(n.getHours())+':'+pad(n.getMinutes()); } });
    saveData(DB);
    setTimeout(render, 300);
    return;
  }
  if(action==='remResp'){
    var id=el.getAttribute('data-id'), r=el.getAttribute('data-r');
    DB.appointments.forEach(function(a){ if(a.id===id) a.reminder.response = (a.reminder.response===r? null : r); });
    saveData(DB); render();
    showToast(r==='confirmed'?'סומן: אישרה הגעה':'סומן: ביקשה שינוי מועד');
    return;
  }
  if(action==='saveRemSettings'){
    var st=DB.reminderSettings;
    st.auto=document.getElementById('rem-auto').checked;
    st.sendTime=document.getElementById('rem-time').value;
    st.template=document.getElementById('rem-template').value.trim() || DEFAULT_TEMPLATE;
    st.prep=document.getElementById('rem-prep').value;
    saveData(DB); render();
    showToast('הגדרות התזכורת נשמרו');
    return;
  }
  if(action==='resetRemTemplate'){
    DB.reminderSettings.template=DEFAULT_TEMPLATE; saveData(DB); render();
    showToast('הנוסח הוחזר לברירת המחדל');
    return;
  }
  if(action==='addNote'){
    var id=el.getAttribute('data-id');
    var txt=document.getElementById('new-note').value.trim();
    if(!txt) return;
    var c=client(id);
    c.history.push({date:todayStr(), note:txt});
    saveData(DB);
    render();
    return;
  }
  if(action==='filterClients'){
    STATE.params.filter=el.getAttribute('data-f');
    render();
    return;
  }
  if(action==='adminDay'){
    var dir=parseInt(el.getAttribute('data-dir'),10);
    var cur=STATE.params.date || todayStr();
    var d=new Date(cur+'T00:00:00');
    d.setDate(d.getDate()+ (dir===1? -1 : 1));
    STATE.params.date=fmtDate(d);
    render();
    return;
  }
  if(action==='saveManualAppt'){
    var existing=document.getElementById('ap-existing').value;
    var svc=document.getElementById('ap-service').value;
    var isPedi=svc!=='face';
    var cid=existing;
    if(!existing){
      var name=document.getElementById('ap-name').value.trim();
      var phone=document.getElementById('ap-phone').value.trim();
      var errEl=document.getElementById('ap-phone-err');
      if(!name){ showToast('נא להזין שם'); return; }
      if(!validPhone(phone)){ errEl.style.display='block'; return; }
      errEl.style.display='none';
      var newC={id:uid(), name:name, phone:phone, email:'', consent:true, health:'טרם עודכן', sessionsTotal:(isPedi?0:12), sessionsUsed:0, paid:0, owed:0, photos:[], history:[], joined:todayStr()};
      DB.clients.push(newC);
      cid=newC.id;
    }
    if(!STATE.booking.date || !STATE.booking.time){ showToast('נא לבחור תאריך ושעה'); return; }
    DB.appointments.push({id:uid(), clientId:cid, date:STATE.booking.date, time:STATE.booking.time, status:'confirmed', manual:true, service:(isPedi?'pedicure':'face'), price:(svc==='pedi-men'?250:200)});
    saveData(DB);
    showToast('התור נשמר');
    pushState('admin','calendar',{date:STATE.booking.date});
    return;
  }
}

function finalizeAppointment(clientId){
  var b=STATE.booking;
  var appt={id:uid(), clientId:clientId, date:b.date, time:b.time, status:'confirmed', manual:false, service:(b.service||'face'), price:(b.price||200)};
  if(b.service==='pedicure'){ appt.pedi={gender:b.gender, problems:b.problems}; }
  DB.appointments.push(appt);
  var c=client(clientId);
  if(c && b.service==='pedicure'){
    c.pediHealth=b.healthText;
    if(!c.health || c.health==='טרם עודכן') c.health=b.healthText;
    else if(c.health.indexOf('פדיקור:')<0) c.health+=' | '+b.healthText;
    c.history=c.history||[];
    c.history.push({date:b.date, note:'פדיקור רפואי נקבע: '+(b.problems||[]).join(', ')});
  }
  saveData(DB);
}

render();
</script>
</body>
</html>
